services:
  care-navigator-lead-gateway:
    build: .
    restart: unless-stopped
    env_file:
      - /docker/care-navigator-leads/.env
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - care-navigator-internal

networks:
  care-navigator-internal:
    name: care-navigator-internal
